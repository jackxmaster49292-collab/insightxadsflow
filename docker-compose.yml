name: insightadflow

x-backend: &backend
  build:
    context: ./backend
  env_file: .env
  environment:
    # Components, not a pre-built DSN. The application percent-encodes each one,
    # so a password may contain "@", "/" or ":" without corrupting the URL.
    # Interpolating a raw password into a DSN here would truncate the host and
    # surface as an unresolvable-hostname error, which points at the wrong thing.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: insight
    POSTGRES_DB: insight
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insight}
    # Blank overrides any DATABASE_URL left in .env, which would otherwise point
    # at localhost from a run outside Docker.
    DATABASE_URL: ""
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks: [insight]

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insight}
      POSTGRES_DB: insight
    ports: ["5433:5432"]
    # Postgres 18+ expects a single mount at /var/lib/postgresql; the data lives
    # in a version-specific subdirectory so pg_upgrade --link can work later.
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [insight]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [insight]

  # Internal only. The control panel is the Telegram bot; this serves the health
  # endpoint and is the process migrations are run through. Bound to loopback so
  # a development machine can curl it without exposing it on the network.
  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]

  # Intake. Scales horizontally: a Redis lock per connection guarantees only one
  # listener opens a client for a given connection.
  listener:
    <<: *backend
    command: ["python", "-m", "app.listener"]
    # These services expose no HTTP port, so the image's HTTP healthcheck does
    # not apply to them.
    healthcheck:
      disable: true

  # Exactly one instance — it owns lease reclaim and retention.
  scheduler:
    <<: *backend
    command: ["python", "-m", "app.scheduler"]
    healthcheck:
      disable: true
    deploy:
      replicas: 1

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true

  # The Telegram control panel. Its token MUST differ from any forwarding bot's:
  # Telegram allows one getUpdates consumer per token and a second gets 409.
  # Exactly one instance — two would fight over the same update stream.
  adminbot:
    <<: *backend
    command: ["python", "-m", "app.adminbot.main"]
    healthcheck:
      disable: true
    deploy:
      replicas: 1

# One explicit network for everything. Compose would create a default anyway,
# but naming it makes the guarantee visible: every service resolves every other
# by its service name, which is what DATABASE_URL=...@postgres:5432 relies on.
networks:
  insight:
    driver: bridge

volumes:
  pgdata:
