name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  # Automated tests never contact real Telegram servers.
  TELEGRAM_PROVIDER: mock

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: insight
          POSTGRES_PASSWORD: insight
          POSTGRES_DB: insight
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U insight" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://insight:insight@localhost:5433/insight
      REDIS_URL: redis://localhost:6380/0
      APP_SECRET_KEY: ci-secret-key-not-used-in-production
      ENCRYPTION_KEK: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
      ENCRYPTION_KEK_VERSION: '1'
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Guard — no live Telegram in any test configuration
        run: |
          if grep -rn "TELEGRAM_PROVIDER.*live" backend/tests .github/workflows; then
            echo "::error::A test configuration targets live Telegram"; exit 1
          fi

      - name: Lint
        working-directory: backend
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Type check
        working-directory: backend
        run: mypy app

      - name: Migrations up and down
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Coverage floor on the critical modules
        working-directory: backend
        run: |
          pytest -q \
            --cov=app.adapters.errors \
            --cov=app.domain.idempotency \
            --cov=app.security.redaction \
            --cov-fail-under=100 --cov-report=term-missing

      - name: Export the API contract and fail if it drifted
        working-directory: backend
        run: |
          python -m app.export_openapi ../openapi.yaml
          git diff --exit-code ../openapi.yaml \
            || (echo "::error::openapi.yaml is out of date — run 'make openapi'"; exit 1)

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Python dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --strict --desc || exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Node dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Container image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
