[project]
name = "insightadflow-backend"
version = "0.1.0"
description = "InsightAdFlow — Telegram forwarding bot backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "redis==8.1.0",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "cryptography==50.0.0",
    "structlog==26.1.0",
    "telethon==1.44.0",
    "aiogram==3.30.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    # QR sign-in. Pure Python and dependency-free, which is why it is preferred
    # over qrcode+Pillow for rendering one small PNG.
    "segno==1.6.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "ruff==0.16.4",
    "greenlet==3.5.5",
    "pyyaml==6.0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"app/db/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One loop for the whole session so the session-scoped engine fixture and the
# function-scoped tests share it (required by pytest-asyncio 1.x).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "live_integration: hits real Telegram servers. NEVER run with production credentials.",
]
addopts = "-m 'not live_integration' --strict-markers"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
