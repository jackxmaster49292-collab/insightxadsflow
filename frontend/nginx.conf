server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Without this, nginx resolves `api` once at startup
    # and keeps proxying to a stale IP after the API container is recreated —
    # every deploy would 502 until nginx was restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Serving the SPA and the API from one origin keeps the session cookie's
    # SameSite=Strict behaviour intact and removes the need for CORS in prod.
    location /api/ {
        # Assigning the upstream to a variable forces per-request re-resolution.
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # can leave a client pinned to a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;
    server_tokens off;
}
