# Production overlay. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The control panel is the Telegram bot, which reaches Telegram by making
# outbound requests. Nothing in this stack needs to accept an inbound connection,
# so production publishes no ports at all — there is no domain to point at it, no
# TLS certificate to obtain, and no web surface to attack.
#
# What this file changes, relative to the base:
#   * the API stops publishing 8000 — it is reachable only inside the network;
#   * Postgres and Redis stop publishing ports. The base file exposes them for
#     local development; on a public VPS that would put your database on the
#     internet.
#   * POSTGRES_PASSWORD becomes mandatory rather than defaulted.

services:
  api:
    ports: !reset []

  # Never expose a database to the internet.
  # POSTGRES_PASSWORD is threaded into both the server and the app's DSN by the
  # base file; this only makes it mandatory in production.
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}

  redis:
    ports: !reset []
