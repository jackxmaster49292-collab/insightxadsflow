openapi: 3.1.0
info:
  title: Insight Store — Telegram Forwarding Bot
  description: Automatic Telegram forwarding between authorized chats. No quotas,
    no subscription limits — and no evasion of Telegram's own limits.
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/telegram:
    post:
      tags:
      - auth
      summary: Telegram Login
      description: 'Sign in from inside a Telegram Mini App.


        Telegram signs the launch payload with a key derived from the bot token, so

        this is a cryptographic proof of identity rather than a claim from the

        client. There is no password involved and none is created.'
      operationId: telegram_login_api_v1_auth_telegram_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
  /api/v1/auth/revoke-all:
    post:
      tags:
      - auth
      summary: Revoke All
      operationId: revoke_all_api_v1_auth_revoke_all_post
      responses:
        '204':
          description: Successful Response
  /api/v1/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
  /api/v1/telegram/connections:
    get:
      tags:
      - connections
      summary: List Connections
      operationId: list_connections_api_v1_telegram_connections_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ConnectionResponse'
                type: array
                title: Response List Connections Api V1 Telegram Connections Get
  /api/v1/telegram/connections/{connection_id}:
    get:
      tags:
      - connections
      summary: Get Connection
      operationId: get_connection_api_v1_telegram_connections__connection_id__get
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Connection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/telegram/connections/bot:
    post:
      tags:
      - connections
      summary: Create Bot Connection
      operationId: create_bot_connection_api_v1_telegram_connections_bot_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotConnectionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/telegram/connections/user/start:
    post:
      tags:
      - connections
      summary: Start User Connection
      operationId: start_user_connection_api_v1_telegram_connections_user_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartUserConnectionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/telegram/connections/user/verify:
    post:
      tags:
      - connections
      summary: Verify User Code
      operationId: verify_user_code_api_v1_telegram_connections_user_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/telegram/connections/{connection_id}/2fa:
    post:
      tags:
      - connections
      summary: Submit 2Fa
      operationId: submit_2fa_api_v1_telegram_connections__connection_id__2fa_post
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Connection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/telegram/connections/{connection_id}/sync:
    post:
      tags:
      - connections
      summary: Sync Chats
      description: 202 and returns. The API never waits for a Telegram round trip.
      operationId: sync_chats_api_v1_telegram_connections__connection_id__sync_post
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Connection Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/telegram/connections/{connection_id}/health-check:
    post:
      tags:
      - connections
      summary: Health Check
      operationId: health_check_api_v1_telegram_connections__connection_id__health_check_post
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Connection Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/telegram/connections/{connection_id}/disconnect:
    post:
      tags:
      - connections
      summary: Disconnect
      operationId: disconnect_api_v1_telegram_connections__connection_id__disconnect_post
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Connection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisconnectRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/telegram/chats:
    get:
      tags:
      - chats
      summary: List Chats
      operationId: list_chats_api_v1_telegram_chats_get
      parameters:
      - name: connection_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Connection Id
      - name: source_eligible
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Source Eligible
      - name: destination_eligible
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Destination Eligible
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      - name: is_public
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Public
      - name: is_active
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
      - name: has_error
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Has Error
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatResponse'
                title: Response List Chats Api V1 Telegram Chats Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/telegram/chats/{chat_id}:
    get:
      tags:
      - chats
      summary: Get Chat
      operationId: get_chat_api_v1_telegram_chats__chat_id__get
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Chat Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/telegram/chats/{chat_id}/check-access:
    post:
      tags:
      - chats
      summary: Check Access
      operationId: check_access_api_v1_telegram_chats__chat_id__check_access_post
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Chat Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forwarding-rules:
    get:
      tags:
      - rules
      summary: List Rules
      operationId: list_rules_api_v1_forwarding_rules_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RuleListItem'
                type: array
                title: Response List Rules Api V1 Forwarding Rules Get
    post:
      tags:
      - rules
      summary: Create Rule
      operationId: create_rule_api_v1_forwarding_rules_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleWriteRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forwarding-rules/{rule_id}:
    get:
      tags:
      - rules
      summary: Get Rule
      operationId: get_rule_api_v1_forwarding_rules__rule_id__get
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - rules
      summary: Update Rule
      operationId: update_rule_api_v1_forwarding_rules__rule_id__patch
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleWriteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - rules
      summary: Delete Rule
      operationId: delete_rule_api_v1_forwarding_rules__rule_id__delete
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forwarding-rules/{rule_id}/activate:
    post:
      tags:
      - rules
      summary: Activate Rule
      operationId: activate_rule_api_v1_forwarding_rules__rule_id__activate_post
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forwarding-rules/{rule_id}/pause:
    post:
      tags:
      - rules
      summary: Pause Rule
      operationId: pause_rule_api_v1_forwarding_rules__rule_id__pause_post
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forwarding-rules/{rule_id}/resume:
    post:
      tags:
      - rules
      summary: Resume Rule
      operationId: resume_rule_api_v1_forwarding_rules__rule_id__resume_post
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forwarding-rules/{rule_id}/events:
    get:
      tags:
      - rules
      summary: List Rule Events
      operationId: list_rule_events_api_v1_forwarding_rules__rule_id__events_get
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      - name: outcome
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Outcome
      - name: destination_chat_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Destination Chat Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
                title: Response List Rule Events Api V1 Forwarding Rules  Rule Id  Events
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forwarding-rules/{rule_id}/retry-failed:
    post:
      tags:
      - rules
      summary: Retry Failed
      description: Requeues only failed / needs-attention work. Successes are never
        replayed.
      operationId: retry_failed_api_v1_forwarding_rules__rule_id__retry_failed_post
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/forwarding-rules/{rule_id}/jobs:
    get:
      tags:
      - rules
      summary: List Rule Jobs
      description: Per-destination status, which is what the Rule Detail page renders.
      operationId: list_rule_jobs_api_v1_forwarding_rules__rule_id__jobs_get
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Rule Jobs Api V1 Forwarding Rules  Rule Id  Jobs
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/health:
    get:
      tags:
      - status
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/activity:
    get:
      tags:
      - status
      summary: Activity
      operationId: activity_api_v1_activity_get
      parameters:
      - name: outcome
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Outcome
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
                title: Response Activity Api V1 Activity Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/usage/summary:
    get:
      tags:
      - status
      summary: Usage Summary
      description: Operational counters only. This product has no quotas to account
        for.
      operationId: usage_summary_api_v1_usage_summary_get
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          pattern: ^(24h|7d|30d)$
          default: 24h
          title: Period
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummaryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit-events:
    get:
      tags:
      - status
      summary: Audit Events
      operationId: audit_events_api_v1_audit_events_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventResponse'
                title: Response Audit Events Api V1 Audit Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AcceptedResponse:
      properties:
        status:
          type: string
          const: accepted
          title: Status
          default: accepted
        task_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Task Id
        message:
          type: string
          title: Message
          default: Queued. Refresh to see the result.
      type: object
      title: AcceptedResponse
      description: 202 body for anything that enqueues background work.
    AuditEventResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        action:
          type: string
          title: Action
        object_type:
          type: string
          title: Object Type
        object_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Object Id
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - action
      - object_type
      - object_id
      - correlation_id
      - created_at
      title: AuditEventResponse
    CapabilitiesResponse:
      properties:
        can_read_subscribed_channels:
          type: boolean
          title: Can Read Subscribed Channels
        can_read_group_messages:
          type: boolean
